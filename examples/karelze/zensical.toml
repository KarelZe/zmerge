# Umbrella site merging the docs of lev and dame-rs with zmerge.
# Build it with: uvx --with mkdocstrings-python --with lev-rs zmerge build --strict
[project]
site_name = "KarelZe's projects"
site_description = "The documentation of lev and dame, merged with zmerge."
site_author = "KarelZe"
site_url = "https://karelze.github.io/zmerge/example/"
repo_url = "https://github.com/KarelZe/zmerge"
repo_name = "KarelZe/zmerge"

nav = [
  { Home = "index.md" },
  { lev = "!include git+https://github.com/KarelZe/lev.git" },
  { dame = "!include git+https://github.com/KarelZe/dame-rs.git" },
]

[project.theme]
variant = "modern"
language = "en"
features = [
  "content.code.copy",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.suggest",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[project.plugins.search]

[project.markdown_extensions.admonition]

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
