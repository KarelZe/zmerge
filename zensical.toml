[project]
site_name = "zmerge"
site_description = "Merge the documentation of multiple Zensical projects into one site with working links and a global search."
site_author = "KarelZe"
site_url = "https://KarelZe.github.io/zmerge/"
repo_url = "https://github.com/KarelZe/zmerge"
repo_name = "KarelZe/zmerge"
edit_uri = "edit/main/docs/"

nav = [
  { Home = "index.md" },
  { Configuration = "configuration.md" },
  { Links = "links.md" },
  { "Command line" = "cli.md" },
  { "Migrating from mkdocs-monorepo-plugin" = "migrating.md" },
  { Limitations = "limitations.md" },
]

[project.theme]
variant = "modern"
language = "en"

features = [
  "content.code.copy",
  "content.code.annotate",
  "navigation.instant",
  "navigation.tracking",
  "navigation.top",
  "search.highlight",
  "search.suggest",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/KarelZe/zmerge"

[project.plugins.search]

[project.markdown_extensions.admonition]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.inlinehilite]
