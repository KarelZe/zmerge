[build-system]
requires = ["uv_build>=0.12.0,<0.14.0"]
build-backend = "uv_build"

[project]
name = "zmerge"
version = "0.1.1"
authors = [{ name = "Markus Bilz", email = "github@markusbilz.com" }]
description = "Merge the documentation of multiple Zensical projects into one site with working links and a global search 📚."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["documentation", "monorepo", "zensical", "mkdocs"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
  "Intended Audience :: Developers",
  "Topic :: Documentation",
  "Topic :: Software Development :: Documentation",
]

dependencies = ["pyyaml>=6.0", "tomli-w>=1.2", "zensical>=0.0.39"]

[project.scripts]
zmerge = "zmerge.cli:main"

[project.urls]
"Homepage" = "https://github.com/KarelZe/zmerge"
"Documentation" = "https://karelze.github.io/zmerge/"
"Bug Tracker" = "https://github.com/KarelZe/zmerge/issues"

[dependency-groups]
test = ["mkdocstrings-python", "pytest", "pytest-cov"]
docs = ["zensical"]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
  "prek>=0.5",
  "ruff",
  "ty",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -p no:warnings -v --cov --cov-report term-missing --doctest-modules"
testpaths = ["tests", "src"]

[tool.coverage.run]
source = ["zmerge"]
branch = true

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:", "if TYPE_CHECKING:"]
show_missing = true

[tool.ty.rules]
unresolved-import = "error"
unused-ignore-comment = "warn"
possibly-unresolved-reference = "error"
redundant-cast = "error"
deprecated = "error"

[tool.uv]
exclude-newer = "7 days"

[tool.ruff]

line-length = 120

[tool.ruff.lint]

# See rules: https://beta.ruff.rs/docs/rules/
select = [
  "A",    # shadow builtins
  "C4",   # Catch incorrect use of comprehensions, dict, list, etc
  "D",    # pydocstyle
  "DOC",  # pydoclint
  "E",    # PyCodeStyle errors
  "F",    # Pyflakes rules
  "FURB", # refurb
  "I",    # isort
  "N",    # enforce naming conventions, e.g. ClassName vs function_name
  "PT",   # pytest
  "PTH",  # flake8-use-pathlib
  "RET",  # Good return practices
  "RUF",  # ruff-specific rules
  "SIM",  # Common simplification rules
  "TC",   # Enforce importing certain types in a TYPE_CHECKING block
  "TD",   # Be diligent with TODO comments
  "TID",  # Some good import practices
  "UP",   # Warn if certain things can changed due to newer Python versions
  "W",    # PyCodeStyle warnings
]

ignore = ["D203", "D212", "DOC502", "E501"]

preview = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pydoclint]
# Short helpers document their behaviour in one line.
ignore-one-line-docstrings = true

[tool.ruff.lint.isort]
known-first-party = ["zmerge"]
section-order = [
  "future",
  "standard-library",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.ruff.format]
preview = true
